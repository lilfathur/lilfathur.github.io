<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.min.css">

    <!-- Custom Style for Audio, WhatsApp, and Popup -->
    <style>
        body {
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Custom Music Player Styling */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            color: white;
            z-index: 9999;
        }

        .music-player button {
            background-color: transparent;
            border: none;
            color: white;
            font-size: 16px;
            margin-right: 10px;
            cursor: pointer;
        }

        .music-player button:hover {
            color: #ff4081;
        }

        .music-player .wave {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #ff4081;
            animation: wave 1.5s infinite;
        }

        @keyframes wave {
            0% {
                transform: scale(0.5);
                opacity: 0.7;
            }

            50% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(0.5);
                opacity: 0.7;
            }
        }

        /* WhatsApp Button Styling */
        .whatsapp-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background-color: #25D366;
            color: white;
            padding: 15px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 9999;
        }

        .whatsapp-btn i {
            font-size: 24px;
        }

        .whatsapp-btn:hover {
            background-color: #128C7E;
        }

        /* Modal Style for Instagram */
        .instagram-modal {
            display: none; 
            position: fixed; 
            z-index: 99999; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            padding-top: 100px;
        }

        .instagram-modal-content {
            background-color: #fff;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .instagram-modal-content p {
            font-size: 18px;
            color: #333;
        }

        .instagram-modal .close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            color: #aaa;
        }

        .instagram-modal .close:hover {
            color: black;
            cursor: pointer;
        }

        /* Modal Style for Quote */
        .quote-modal {
            display: none; 
            position: fixed; 
            z-index: 99999; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            padding-top: 100px;
        }

        .quote-modal-content {
            background-color: #fff;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .quote-modal-content p {
            font-size: 18px;
            font-style: italic;
            color: #333;
        }

        .quote-modal .close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            color: #aaa;
        }

        .quote-modal .close:hover {
            color: black;
            cursor: pointer;
        }

        /* Modal Style for Subscribe Popup */
        .subscribe-modal {
            display: none; 
            position: fixed; 
            z-index: 99999; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            padding-top: 100px;
        }

        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .modal-content h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .subscribe-btn {
            background-color: #FF0000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }

        .subscribe-btn:hover {
            background-color: #cc0000;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            position: absolute;
            top: 10px;
            right: 20px;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- HEADER -->

    <!-- Audio Player -->

        <!-- Instagram Modal -->

    <!-- slider JS START -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#containerSlider').slick({
                dots: true,
                infinite: true,
                slidesToShow: 1,
                slidesToScroll: 1,
                autoplay: true,
                autoplaySpeed: 1500,
            });
        });
    </script>
    
    <!-- Music Play Button Script -->
    <script>
        const playPauseBtn = document.getElementById('playPauseBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        const wave = document.querySelector('.music-player .wave');

        let isPlaying = false;

        playPauseBtn.addEventListener('click', function() {
            if (isPlaying) {
                audioPlayer.pause();
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                wave.style.animation = 'none';
            } else {
                audioPlayer.play();
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                wave.style.animation = 'wave 1.5s infinite';
            }
            isPlaying = !isPlaying;
        });
    </script>

    <!-- Instagram Modal Script -->
    <script>
        var instagramModal = document.getElementById("instagramModal");
        var closeInstagramBtn = document.getElementsByClassName("close")[0];

        // Show the Instagram modal when the page loads (2 seconds after load)
        window.onload = function() {
            setTimeout(function() {
                instagramModal.style.display = "block";
            }, 2000); // Show Instagram modal after 2 seconds
        };

        // Close the Instagram modal when the user clicks the close button
        function closeInstagram() {
            instagramModal.style.display = "none";

            // After closing the Instagram modal, show the quote modal
            setTimeout(function() {
                document.getElementById("quoteModal").style.display = "block";
            }, 500); // Wait for the Instagram modal to close before showing the quote modal
        }

        // Close the modal if the user clicks outside of the modal
        window.onclick = function(event) {
            if (event.target == instagramModal) {
                closeInstagram();
            }
            if (event.target == quoteModal) {
                closeQuote();
            }
            if (event.target == subscribeModal) {
                closeSubscribe();
            }
        };
    </script>

    <!-- Quote Modal Script -->
    <script>
        var quoteModal = document.getElementById("quoteModal");
        var closeQuoteBtn = document.getElementsByClassName("close")[1];

        // Show the quote modal after Instagram modal is closed (3 seconds after)
        function closeQuote() {
            quoteModal.style.display = "none";

            // After closing the quote modal, show the subscribe modal
            setTimeout(function() {
                document.getElementById("subscribeModal").style.display = "block";
            }, 500); // Wait for the quote modal to close before showing the subscribe modal
        }
    </script>

    <!-- Subscribe Modal Script -->
    <script>
        var subscribeModal = document.getElementById("subscribeModal");
        var closeSubscribeBtn = document.getElementsByClassName("close")[2];

        // Close the subscribe modal when the user clicks the close button
        function closeSubscribe() {
            subscribeModal.style.display = "none";
        }
    </script>

    <!-- content JS -->
    <script src="content.js"></script>
