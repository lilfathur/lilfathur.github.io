<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>x99Gang Official</title>
    <!-- favicon -->
    <link rel="icon" href="https://yt3.ggpht.com/a/AGF-l78km1YyNXmF0r3-0CycCA0HLA_i6zYn_8NZEg=s900-c-k-c0xffffffff-no-rj-mo" type="image/gif" sizes="16x16">

    <!-- header links -->
    <script src="https://kit.fontawesome.com/4a3b1f73a2.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet">

    <!-- slider links -->
    <script src="js/jQuery3.4.1.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.min.css">

    <!-- Custom Style for Audio, WhatsApp, and Popup -->
    <style>
        body {
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Custom Music Player Styling */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            color: white;
            z-index: 9999;
            background-color: red; /* Debugging color */
            border: 2px solid black; /* Debugging border */
        }

        .music-player button {
            background-color: transparent;
            border: none;
            color: white;
            font-size: 16px;
            margin-right: 10px;
            cursor: pointer;
        }

        .music-player button:hover {
            color: #ff4081;
        }

        .music-player .wave {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #ff4081;
            animation: wave 1.5s infinite;
        }

        @keyframes wave {
            0% {
                transform: scale(0.5);
                opacity: 0.7;
            }

            50% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(0.5);
                opacity: 0.7;
            }
        }

        /* WhatsApp Button Styling */
        .whatsapp-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background-color: #25D366;
            color: white;
            padding: 15px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 9999;
            background-color: red; /* Debugging color */
            border: 2px solid black; /* Debugging border */
        }

        .whatsapp-btn i {
            font-size: 24px;
        }

        .whatsapp-btn:hover {
            background-color: #128C7E;
        }

        /* Modal Style for Instagram */
        .instagram-modal {
            display: none;
            position: fixed;
            z-index: 99999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            padding-top: 100px;
        }

        .instagram-modal-content {
            background-color: #fff;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .instagram-modal-content p {
            font-size: 18px;
            color: #333;
        }

        .instagram-modal .close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            color: #aaa;
        }

        .instagram-modal .close:hover {
            color: black;
            cursor: pointer;
        }

        /* Modal Style for Quote */
        .quote-modal {
            display: none;
            position: fixed;
            z-index: 99999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            padding-top: 100px;
        }

        .quote-modal-content {
            background-color: #fff;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .quote-modal-content p {
            font-size: 18px;
            font-style: italic;
            color: #333;
        }

        .quote-modal .close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            color: #aaa;
        }

        .quote-modal .close:hover {
            color: black;
            cursor: pointer;
        }

        /* Modal Style for Subscribe Popup */
        .subscribe-modal {
            display: none;
            position: fixed;
            z-index: 99999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            padding-top: 100px;
        }

        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .modal-content h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .subscribe-btn {
            background-color: #FF0000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }

        .subscribe-btn:hover {
            background-color: #cc0000;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            position: absolute;
            top: 10px;
            right: 20px;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <div id="1"></div>
    <script>
        load("header.html");

        function load(url) {
            req = new XMLHttpRequest();
            req.open("GET", url, false);
            req.send(null);
            document.getElementById(1).innerHTML = req.responseText;
        }
    </script>

    <!-- SLIDER -->
    <div id="2"></div>
    <script>
        load("slider.html");

        function load(url) {
            req = new XMLHttpRequest();
            req.open("GET", url, false);
            req.send(null);
            document.getElementById(2).innerHTML = req.responseText;
        }
    </script>

    <!-- CONTENT SECTION -->
    <div id="3"></div>
    <script>
        load("content.html");

        function load(url) {
            req = new XMLHttpRequest();
            req.open("GET", url, false);
            req.send(null);
            document.getElementById(3).innerHTML = req.responseText;
        }
    </script>

    <!-- FOOTER -->
    <div id="4"></div>
    <script>
        load("footer.html");

        function load(url) {
            req = new XMLHttpRequest();
            req.open("GET", url, false);
            req.send(null);
            document.getElementById(4).innerHTML = req.responseText;
        }
    </script>

    <!-- Audio Player -->
    <div class="music-player">
        <button id="playPauseBtn">
            <i class="fas fa-play"></i>
        </button>
        <div class="wave"></div>
        <audio id="audioPlayer" loop>
            <source src="/kasar.mp3" type="audio/mp3">
            Your browser does not support the audio element.
        </audio>
    </div>

    <!-- WhatsApp Button -->
    <a href="https://wa.me/6285942840954" target="_blank">
        <div class="whatsapp-btn">
            <i class="fab fa-whatsapp"></i>
        </div>
    </a>

    <!-- Modal for Instagram -->
    <div id="instagramModal" class="instagram-modal">
        <div class="instagram-modal-content">
            <span class="close">&times;</span>
            <p>Follow us on Instagram!</p>
        </div>
    </div>

    <!-- Modal for Quote -->
    <div id="quoteModal" class="quote-modal">
        <div class="quote-modal-content">
            <span class="close">&times;</span>
            <p>"The best is yet to come!"</p>
        </div>
    </div>

    <!-- Subscribe Popup Modal -->
    <div id="subscribeModal" class="subscribe-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Subscribe to our Newsletter</h2>
            <button class="subscribe-btn">Subscribe</button>
        </div>
    </div>
</body>

</html>
